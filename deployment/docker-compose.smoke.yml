# Only for deployment/smoke.sh (and a staging rehearsal, see docs/go-live.md): publish the app on localhost
# and read the throwaway env file. Container names and Traefik labels are dropped so it cannot collide with a real stack.
services:
  db:
    container_name: !reset null
  backup:
    container_name: !reset null
  web:
    container_name: !reset null
    # Replaces (not adds to) the base file's env_file, so a real deployment/.env is never read by a smoke or staging stack.
    env_file: !override
      - ${GLASSHOUSE_ENV_FILE:-.env.smoke}
    ports: ['127.0.0.1:18787:8787']
    labels:
      traefik.enable: 'false'
